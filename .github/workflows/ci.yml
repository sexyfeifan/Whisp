# CI checks: run on every push and PR to catch issues early.
name: CI

on:
  push:
    branches: [main, 'v2.*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Rust checks (clippy + fmt + tests) ──
  rust-checks:
    runs-on: ubuntu-22.04
    name: Rust Checks

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Check formatting
        run: cd src-tauri && cargo fmt -- --check

      - name: Run Clippy
        run: cd src-tauri && cargo clippy -- -D warnings 2>&1

      - name: Run Rust tests
        run: |
          cd src-tauri
          cargo test --lib 2>&1
        shell: bash

  # ── Frontend checks (TypeScript + ESLint + tests) ──
  frontend-checks:
    runs-on: ubuntu-latest
    name: Frontend Checks

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --ext .ts,.tsx

      - name: Frontend tests
        run: npx vitest run

  # ── ARM64 Linux cross-compilation check ──
  arm64-build:
    runs-on: ubuntu-22.04
    name: ARM64 Linux Build

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cross-compilation dependencies
        run: |
          sudo dpkg --add-architecture arm64
          # Add arm64 ports sources for multiarch
          sudo sed -i 's/^deb /deb [arch=amd64,i386] /' /etc/apt/sources.list
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ jammy main restricted universe multiverse' | sudo tee /etc/apt/sources.list.d/arm64.list
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ jammy-updates main restricted universe multiverse' | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            cmake \
            pkg-config \
            libwebkit2gtk-4.1-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64 \
            libasound2-dev:arm64 \
            patchelf

      - name: Setup ARM64 cross-compilation
        run: |
          # Configure cargo for ARM64 cross-compilation
          mkdir -p ~/.cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build ARM64
        run: |
          cd src-tauri
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          cargo build --release --target aarch64-unknown-linux-gnu --no-default-features 2>&1 | tail -60
        shell: bash

  # ── Version sync check ──
  version-sync-check:
    runs-on: ubuntu-latest
    name: Version Sync Check

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify version consistency
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "package.json version: $PKG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$PKG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch: package.json ($PKG_VERSION) != Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          echo "✓ Versions are in sync: $PKG_VERSION"
