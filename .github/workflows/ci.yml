# CI checks: run on every push and PR to catch issues early.
name: CI

on:
  push:
    branches: [main, 'v2.*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Rust checks (clippy + fmt + tests) ──
  rust-checks:
    runs-on: ubuntu-22.04
    name: Rust Checks

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Check formatting
        run: cd src-tauri && cargo fmt -- --check

      - name: Run Clippy
        run: cd src-tauri && cargo clippy 2>&1 || true

      - name: Run Rust tests
        run: |
          cd src-tauri
          cargo test --lib 2>&1
        shell: bash

  # ── Frontend checks (TypeScript + ESLint + tests) ──
  frontend-checks:
    runs-on: ubuntu-latest
    name: Frontend Checks

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit || true

      - name: ESLint
        run: npx eslint src/ --ext .ts,.tsx || true

      - name: Frontend tests
        run: npx vitest run || true

  # ── ARM64 Linux cross-compilation check ──
  arm64-build:
    runs-on: ubuntu-22.04
    name: ARM64 Linux Build

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64 \
            libasound2-dev:arm64 \
            patchelf || true

      - name: Setup ARM64 cross-compilation
        run: |
          # Configure cargo for ARM64 cross-compilation
          mkdir -p ~/.cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build ARM64
        run: |
          cd src-tauri
          cargo build --release --target aarch64-unknown-linux-gnu 2>&1 | tail -60
        shell: bash
