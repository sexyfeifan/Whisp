# Build and release Whisp for all supported platforms.
#
# Trigger: push a version tag (e.g., git tag v0.1.0 && git push --tags)
#
# Runner matrix:
#   macOS ARM64  → macos-latest  (Apple Silicon, native)
#   macOS x64    → macos-latest  (Apple Silicon, cross-compiled via --target)
#   Linux x64    → ubuntu-22.04
#   Windows x64  → windows-latest
#
# Code signing:
#   macOS:   Developer ID Application certificate + Apple notarization
#   Windows: Azure Trusted Signing via trusted-signing-cli
#   Linux:   not signed

name: Whisp Auto Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Prevent concurrent releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: release-mac-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: release-mac-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: release-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: release-win-x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.artifact }})
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ""
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify version consistency
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          echo "Tag version:       $TAG_VERSION"
          echo "package.json:      $PKG_VERSION"
          echo "Cargo.toml:        $CARGO_VERSION"
          echo "tauri.conf.json:   $TAURI_VERSION"

          ERRORS=0
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: package.json ($PKG_VERSION) != tag ($TAG_VERSION)"
            ERRORS=1
          fi
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: Cargo.toml ($CARGO_VERSION) != tag ($TAG_VERSION)"
            ERRORS=1
          fi
          if [ "$TAURI_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: tauri.conf.json ($TAURI_VERSION) != tag ($TAG_VERSION)"
            ERRORS=1
          fi
          if [ "$ERRORS" -ne 0 ]; then
            echo "::error::Fix: update all version fields to $TAG_VERSION before tagging"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Linux: install system dependencies required by Tauri and cpal (ALSA)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            rpm

      # Install npm deps BEFORE importing signing credentials (minimize exposure window)
      - name: Install dependencies
        run: npm ci

      # ── macOS code signing setup ────────────────────────────────
      - name: Install Apple intermediate certificate
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != ''
        run: |
          curl -sO https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          sudo security import DeveloperIDG2CA.cer -k /Library/Keychains/System.keychain -T /usr/bin/codesign 2>&1 || echo "(already installed, skipping)"
          echo "Apple Developer ID G2 intermediate certificate ready"

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.MAC_CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::error::Missing secret: MAC_CSC_LINK"
            exit 1
          fi
          if [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::Missing secret: MAC_CSC_KEY_PASSWORD"
            exit 1
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32 | tr -d '\n')

          CERT_INPUT="$APPLE_CERTIFICATE"
          CERT_INPUT="${CERT_INPUT#data:application/x-pkcs12;base64,}"
          CERT_INPUT="${CERT_INPUT#data:application/octet-stream;base64,}"

          if ! printf '%s' "$CERT_INPUT" | base64 --decode > "$CERTIFICATE_PATH" 2>/dev/null; then
            if ! printf '%s' "$CERT_INPUT" | base64 -D > "$CERTIFICATE_PATH" 2>/dev/null; then
              echo "::error::MAC_CSC_LINK is not valid base64-encoded .p12 data"
              exit 1
            fi
          fi

          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "::error::Decoded certificate file is empty"
            exit 1
          fi

          if ! openssl pkcs12 -in "$CERTIFICATE_PATH" -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -nokeys >/dev/null 2>&1; then
            echo "::error::Invalid .p12 certificate or incorrect MAC_CSC_KEY_PASSWORD"
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 21600 -u "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -f pkcs12 -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          rm "$CERTIFICATE_PATH"

      - name: Set up Apple API key for notarization
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != '' && env.APPLE_API_KEY != ''
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPLE_API_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "Notarization API key ready"

      # (Windows signing is done post-build via azure/trusted-signing-action)

      # ── Platform-specific builds ────────────────────────────────
      - name: Build Tauri app (macOS, signed)
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != ''
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Jicai, Inc. (NDX2ZZ8U2R)"
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_ID != '' && format('{0}/.appstoreconnect/private_keys/AuthKey_{1}.p8', env.HOME, env.APPLE_API_KEY_ID) || '' }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Build Tauri app (macOS, unsigned)
        if: runner.os == 'macOS' && (env.MAC_CSC_LINK == '' || env.MAC_CSC_KEY_PASSWORD == '')
        run: |
          echo "::warning::MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD missing, building unsigned macOS artifact"
          npx tauri build --target ${{ matrix.target }}

      - name: Ad-hoc sign macOS app (unsigned path)
        if: runner.os == 'macOS' && (env.MAC_CSC_LINK == '' || env.MAC_CSC_KEY_PASSWORD == '')
        run: |
          echo "Looking for .app in: src-tauri/target/${{ matrix.target }}/release/bundle/"
          find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.app" -type d
          APP=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.app" -type d | head -1)
          echo "Found app bundle: $APP"
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle found!"
            find src-tauri/target/${{ matrix.target }}/release -maxdepth 4 -type d | head -20
            exit 1
          fi

          # Strip any extended attributes (quarantine etc.)
          xattr -cr "$APP"

          # Force ad-hoc sign the app bundle with entitlements (required for Apple Silicon)
          codesign --force --deep --sign - "$APP"

          # Verify ad-hoc signature
          echo "=== Ad-hoc signature verification ==="
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP"

          # Re-package DMG with signed app
          DMG=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" | head -1)
          echo "Original DMG: $DMG"

          if [ -n "$DMG" ]; then
            DMG_DIR=$(mktemp -d)
            cp -R "$APP" "$DMG_DIR/"
            rm -f "$DMG"
            hdiutil create -volname "Whisp" -srcfolder "$DMG_DIR" -ov -format UDZO "$DMG"
            rm -rf "$DMG_DIR"
            echo "Re-packaged DMG with ad-hoc signed app: $DMG"
          fi

      - name: Build Tauri app (Windows)
        if: runner.os == 'Windows'
        run: npx tauri build --target ${{ matrix.target }}

      - name: Sign Windows artifacts
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != ''
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: golemancy
          certificate-profile-name: golemancy
          files-folder: src-tauri/target/${{ matrix.target }}/release/bundle
          files-folder-filter: exe,msi
          files-folder-depth: 5

      - name: Skip Windows signing (unsigned path)
        if: runner.os == 'Windows' && (env.AZURE_TENANT_ID == '' || env.AZURE_CLIENT_ID == '' || env.AZURE_CLIENT_SECRET == '')
        run: echo "::warning::AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET missing, building unsigned Windows artifact"

      - name: Build Tauri app (Linux)
        if: runner.os == 'Linux'
        run: npx tauri build --target ${{ matrix.target }}

      # ── Verification ────────────────────────────────────────────
      - name: Verify macOS code signing
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != '' && env.MAC_CSC_KEY_PASSWORD != ''
        run: |
          DMG=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" | head -1)
          echo "Verifying DMG: $DMG"
          test -n "$DMG"

          echo "=== DMG integrity ==="
          hdiutil verify "$DMG"

          echo "=== Code signature ==="
          codesign --verify --deep --strict --verbose=2 \
            "$(hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/whisp-verify && find /tmp/whisp-verify -name '*.app' | head -1)"

          echo "=== Gatekeeper assessment ==="
          spctl -a -t open --context context:primary-signature -vvv /tmp/whisp-verify/*.app 2>&1 || true

          echo "=== Notarization staple ==="
          xcrun stapler validate "$DMG"

          hdiutil detach /tmp/whisp-verify -quiet

      - name: Verify macOS artifact (unsigned path)
        if: runner.os == 'macOS' && (env.MAC_CSC_LINK == '' || env.MAC_CSC_KEY_PASSWORD == '')
        run: |
          DMG=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" | head -1)
          echo "Verifying DMG exists: $DMG"
          test -n "$DMG"
          hdiutil verify "$DMG"

          # Verify app inside DMG is signed
          MOUNT_POINT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -mountpoint "$MOUNT_POINT"
          APP=$(find "$MOUNT_POINT" -name "*.app" | head -1)
          echo "Verifying app signature: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "=== Signature details ==="
          codesign -dvv "$APP"
          hdiutil detach "$MOUNT_POINT"

      - name: Verify Windows code signing
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != ''
        shell: pwsh
        run: |
          $allValid = $true
          $files = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle" -Recurse -Include *.exe,*.msi
          foreach ($file in $files) {
            Write-Host "Verifying: $($file.FullName)"
            $sig = Get-AuthenticodeSignature $file.FullName
            Write-Host "  Status: $($sig.Status)"
            Write-Host "  Signer: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::Signature invalid for $($file.Name): $($sig.Status)"
              $allValid = $false
            }
          }
          if (-not $allValid) { exit 1 }

      - name: Verify Windows artifact (unsigned path)
        if: runner.os == 'Windows' && (env.AZURE_TENANT_ID == '' || env.AZURE_CLIENT_ID == '' || env.AZURE_CLIENT_SECRET == '')
        shell: pwsh
        run: |
          $files = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle" -Recurse -Include *.exe,*.msi
          if ($files.Count -eq 0) {
            Write-Host "::error::No Windows artifacts found"
            exit 1
          }
          Write-Host "Found unsigned Windows artifacts:"
          $files | ForEach-Object { Write-Host "  $($_.FullName)" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/latest.json
          if-no-files-found: error
          retention-days: 3

  # ── Create GitHub Release ─────────────────────────────────────
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Flatten nested bundle directory structure into a single folder
      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.AppImage" -o \
            -name "*.sig" \
          \) -exec cp {} release/ \;
          
          # Collect all latest.json files from each platform build
          find artifacts -name "latest.json" -exec cp {} release/ \;
          
          echo "Release files:"
          ls -lh release/

      - name: Merge updater latest.json
        run: |
          cd release
          # If multiple latest.json exist, merge their platforms into one
          JSON_COUNT=$(ls latest.json 2>/dev/null | wc -l)
          if [ "$JSON_COUNT" -gt 0 ]; then
            echo "Found latest.json files, merging..."
            # Use node to merge all latest.json files
            node -e '
              const fs = require("fs");
              const merged = { version: "", notes: "", pub_date: "", platforms: {} };
              const files = fs.readdirSync(".").filter(f => f === "latest.json");
              // Read from artifacts subdirectories too
              const walk = (dir) => {
                try {
                  for (const f of fs.readdirSync(dir)) {
                    const p = dir + "/" + f;
                    if (f === "latest.json") {
                      const data = JSON.parse(fs.readFileSync(p, "utf8"));
                      merged.version = data.version || merged.version;
                      merged.notes = data.notes || merged.notes;
                      merged.pub_date = data.pub_date || merged.pub_date;
                      Object.assign(merged.platforms, data.platforms || {});
                    } else if (fs.statSync(p).isDirectory()) {
                      walk(p);
                    }
                  }
                } catch {}
              };
              walk("../artifacts");
              // Fix URLs to point to GitHub release
              for (const [key, val] of Object.entries(merged.platforms)) {
                if (val.url) {
                  const filename = val.url.split("/").pop();
                  val.url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" + filename;
                }
              }
              fs.writeFileSync("latest.json", JSON.stringify(merged, null, 2));
              console.log("Merged latest.json:", JSON.stringify(merged, null, 2));
            '
          else
            echo "No latest.json found, skipping updater manifest"
          fi

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          echo "Generated checksums:"
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Whisp Auto Build ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
          body: |
            > 本条目由 GitHub Actions 自动构建生成。

            ## Whisp 语音转文字工具

            说话即输入，停下即粘贴。一款极简高效的桌面语音转文字工具。

            ### 核心功能

            - **语音转文字**：按快捷键说话，文字自动粘贴到当前应用
            - **AI 润色**：自动纠错、去除口癖、口语转书面语
            - **多服务商**：支持 OpenAI、Groq、DeepSeek、小米 MiMo 等
            - **Token 计费**：自动统计转写费用和 AI 润色 Token 用量
            - **设置导入导出**：一键备份和恢复全部配置
            - **运行日志**：实时查看应用运行日志，便于排查问题

            ### 安装说明

            #### macOS

            1. 下载 `.dmg` 文件，打开后将 Whisp 拖入 Applications
            2. 打开终端，运行以下命令移除 Gatekeeper 隔离标记：
            ```bash
            sudo xattr -cr /Applications/Whisp.app
            ```
            3. 双击 Whisp.app 即可正常使用

            > ⚠️ macOS 会提示"无法验证开发者"，这是正常的（应用未通过 Apple 公证）。
            > 上述 `xattr -cr` 命令只需运行一次。

            - **Windows**：下载 `.exe` 安装程序，双击运行按提示安装
            - **Linux**：下载 `.deb` 或 `.rpm` 包安装，或使用 `.AppImage` 便携版

            ### 下载

            | 文件 | 平台 | 说明 |
            |------|------|------|
            | `Whisp_x.x.x_aarch64.dmg` | macOS | Apple Silicon (M1/M2/M3/M4) **推荐** |
            | `Whisp_x.x.x_x64.dmg` | macOS | Intel Mac |
            | `Whisp_x.x.x_x64-setup.exe` | Windows | NSIS 安装程序 **推荐** |
            | `Whisp_x.x.x_x64_en-US.msi` | Windows | MSI 安装包 |
            | `Whisp_x.x.x_amd64.deb` | Linux | Ubuntu/Debian **推荐** |
            | `Whisp_x.x.x-1.x86_64.rpm` | Linux | Fedora/RHEL |
            | `Whisp_x.x.x_amd64.AppImage` | Linux | 通用便携版 |

      # Clean up temporary build artifacts to free storage quota
      - name: Delete temporary build artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: release-*
