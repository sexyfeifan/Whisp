<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000033"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Microphone body -->
  <g filter="url(#shadow)">
    <!-- Mic capsule -->
    <rect x="216" y="120" width="80" height="160" rx="40" fill="url(#micGrad)" opacity="0.95"/>
    <!-- Mic grille lines -->
    <line x1="232" y1="160" x2="280" y2="160" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <line x1="232" y1="176" x2="280" y2="176" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <line x1="232" y1="192" x2="280" y2="192" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <line x1="232" y1="208" x2="280" y2="208" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <line x1="232" y1="224" x2="280" y2="224" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <line x1="232" y1="240" x2="280" y2="240" stroke="#6366f1" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    
    <!-- Mic stand arc -->
    <path d="M184 280 C184 340 232 380 256 380 C280 380 328 340 328 280" stroke="white" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.9"/>
    <!-- Mic stand vertical -->
    <line x1="256" y1="380" x2="256" y2="420" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <!-- Mic stand base -->
    <line x1="220" y1="420" x2="292" y2="420" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  </g>
  
  <!-- Sound waves (left) -->
  <path d="M140 200 C130 220 130 260 140 280" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M116 180 C100 210 100 270 116 300" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Sound waves (right) -->
  <path d="M372 200 C382 220 382 260 372 280" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M396 180 C412 210 412 270 396 300" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Sparkle dots -->
  <circle cx="160" cy="140" r="4" fill="white" opacity="0.5"/>
  <circle cx="352" cy="140" r="4" fill="white" opacity="0.5"/>
  <circle cx="120" cy="340" r="3" fill="white" opacity="0.3"/>
  <circle cx="392" cy="340" r="3" fill="white" opacity="0.3"/>
</svg>
